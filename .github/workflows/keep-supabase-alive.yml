name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (11:00 AM Bangkok time) to prevent 7-day inactivity pause
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://cjmzxgleiyjmmekplarl.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqbXp4Z2xlaXlqbW1la3BsYXJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTk1NTYsImV4cCI6MjA5NzQ3NTU1Nn0.BYGRrHLvbP9qzEREs1wACjU5VK62hBR-WFYl81jz--s}"
          
          echo "Pinging Supabase REST API to maintain active status..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$URL/rest/v1/insect_inspections?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
            
          echo "Supabase HTTP Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ] || [ "$HTTP_STATUS" -eq 206 ]; then
            echo "Successfully communicated with Supabase! Database remains active."
          else
            echo "Unexpected response code: $HTTP_STATUS"
            exit 1
          fi
